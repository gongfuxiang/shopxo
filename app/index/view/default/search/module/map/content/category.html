<!-- 商品分类搜索条件模块 -->
{{if !empty($module_data['category_list'])}}
    <li class="am-nbfc map-category-container" data-field="category_ids">
        <div class="map-left am-text-center">{{:MyLang('category_title')}}</div>
        <div class="map-more-submit am-hide">
            <span>{{:MyLang('more_title')}}</span>
            <i class="am-icon-angle-down"></i>
        </div>
        <div class="map-right map-text-items am-nbfc theme-data-edit-event" data-module="goods_category">
            <ul class="am-nbfc">
                {{foreach $module_data.category_list as $v}}
                    <li {{if isset($v['is_active']) and $v['is_active'] eq 1}}class="active"{{/if}} data-id="{{$v.id}}">
                        <a href="{{$v.url}}" data-id="{{$v.id}}">{{$v.name}}</a>
                    </li>
                {{/foreach}}
            </ul>
        </div>
    </li>
{{/if}}
