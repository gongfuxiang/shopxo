<!-- 商品产地搜索条件模块 -->
{{if !empty($module_data['goods_produce_region_list'])}}
    <li class="am-nbfc goods-place-origin-container" data-field="goods_produce_region_values">
        <div class="map-left am-text-center">{{:MyLang('produce_region_title')}}</div>
        <div class="map-more-submit am-hide">
            <span>{{:MyLang('more_title')}}</span>
            <i class="am-icon-angle-down"></i>
        </div>
        <div class="map-right map-text-items am-nbfc">
            <ul class="am-nbfc">
                {{foreach $module_data.goods_produce_region_list as $v}}
                    <li {{if isset($v['is_active']) and $v['is_active'] eq 1}}class="active"{{/if}} data-id="{{$v.id}}">
                        <a href="{{$v.url}}" data-id="{{$v.id}}">{{$v.name}}</a>
                    </li>
                {{/foreach}}
            </ul>
        </div>
    </li>
{{/if}}
