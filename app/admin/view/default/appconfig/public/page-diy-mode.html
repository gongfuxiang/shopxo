<div class="home-diy-template-list am-margin-bottom-lg">
    {{foreach $common_platform_type as $v}}
        {{if !in_array($v['value'], ['pc'])}}
            <div class="am-flex am-flex-row am-flex-items-center am-gap-1 am-margin-top-sm">
                <span class="am-text-right">{{$v.name}}</span>
                <select name="{{$module_data['diy_mode_key']}}[{{$v.value}}][diy_id]" class="am-radius chosen-select" data-placeholder="{{:MyLang('optional_tips')}}" data-validation-message="{{:MyLang('site.site_setup_choice_payment_message', ['name'=>$v['name']])}}">
                    <option value="">{{:MyLang('optional_tips')}}</option>
                    {{if isset($module_data['diy_mode_key']) and $module_data['diy_mode_key'] eq 'common_app_goods_detail_data_diy_mode'}}
                        {{if !empty($goods_detail_diy_list)}}
                            {{foreach $goods_detail_diy_list as $diy}}
                                <option value="{{$diy.id}}" {{if !empty($data[$module_data['diy_mode_key']]) and !empty($data[$module_data['diy_mode_key']]['value']) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]['diy_id']) and $data[$module_data['diy_mode_key']]['value'][$v['value']]['diy_id'] eq $diy['id']}}selected{{/if}}>{{$diy.name}}</option>
                            {{/foreach}}
                        {{/if}}
                    {{else /}}
                        {{if !empty($diy_list)}}
                            {{foreach $diy_list as $diy}}
                                <option value="{{$diy.id}}" {{if !empty($data[$module_data['diy_mode_key']]) and !empty($data[$module_data['diy_mode_key']]['value']) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]['diy_id']) and $data[$module_data['diy_mode_key']]['value'][$v['value']]['diy_id'] eq $diy['id']}}selected{{/if}}>{{$diy.name}}</option>
                            {{/foreach}}
                        {{/if}}
                    {{/if}}
                </select>
                <div class="form-multiple-where-input am-margin-left-sm">
                    <input type="text" autocomplete="off" name="{{$module_data['diy_mode_key']}}[{{$v.value}}][time_start]" class="Wdate am-radius" placeholder="{{:MyLang('form_time_start_title')}}" onclick="WdatePicker({firstDayOfWeek:1,dateFmt:'yyyy-MM-dd HH:mm:ss'})" value="{{if !empty($data[$module_data['diy_mode_key']]) and !empty($data[$module_data['diy_mode_key']]['value']) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]['time_start'])}}{{$data[$module_data['diy_mode_key']]['value'][$v['value']]['time_start']}}{{/if}}" />
                    <span class="am-text-grey">~</span>
                    <input type="text" autocomplete="off" class="Wdate am-radius" placeholder="{{:MyLang('form_time_end_title')}}" name="{{$module_data['diy_mode_key']}}[{{$v.value}}][time_end]" onclick="WdatePicker({firstDayOfWeek:1,dateFmt:'yyyy-MM-dd HH:mm:ss'})" value="{{if !empty($data[$module_data['diy_mode_key']]) and !empty($data[$module_data['diy_mode_key']]['value']) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]) and !empty($data[$module_data['diy_mode_key']]['value'][$v['value']]['time_end'])}}{{$data[$module_data['diy_mode_key']]['value'][$v['value']]['time_end']}}{{/if}}" />
                </div>
            </div>
        {{/if}}
    {{/foreach}}
</div>
