{{if is_array(MyLang('event_value_tips_list'))}}
    <div class="am-tips-card">
        {{foreach :MyLang('event_value_tips_list') as $k=>$v}}
            <div {{if $k gt 0}}class="am-margin-top-xs"{{/if}}>
                <p><strong>{{$v.name}}</strong></p>
                {{if !empty($v['item'])}}
                    <div class="am-padding-left-lg">
                        {{foreach $v.item as $vs}}
                            <p>{{$vs}}</p>
                        {{/foreach}}
                        {{if !empty($v['tips']) and $v['type'] eq 'mini'}}
                            <p>
                                <a href="javascript:;" class="submit-popup" data-url="{{:MyUrl('admin/appmini/pages', ['is_use'=>1])}}" data-title="{{$v.tips}}" data-offcanvas="right">{{$v.tips}} <i class="am-icon-link"></i></a>
                            </p>
                        {{/if}}
                    </div>
                {{/if}}
            </div>
        {{/foreach}}
    </div>
{{/if}}
