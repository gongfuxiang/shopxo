{{if !empty($module_data['popup']) and !empty($module_data['popup_id'])}}
    <div class="am-popup am-popup-offcanvas-right am-popup-full am-popup-full-max label-print-popup" id="{{$module_data.popup_id}}" data-am-modal="{closeViaDimmer: false}">
        <div class="am-popup-inner">
            <div class="am-popup-hd">
                <h4 class="am-popup-title">{{$module_data.popup_title}}</h4>
                <span data-am-modal-close class="am-close">&times;</span>
            </div>
            <div class="am-popup-bd">
                <div class="am-form-popup-container am-padding">
                    <form class="am-form form-validation am-form-popup-fixed" action="javascript:;" method="POST" onsubmit="return false;">
                        <div class="label-print-designer-box">
                            <textarea class="am-hide label-print-draft-input"></textarea>
                            <script type="application/json" class="label-print-type-data">{{if empty($module_data['type_data'])}}{}{{else /}}{{:json_encode($module_data.type_data, JSON_UNESCAPED_UNICODE)}}{{/if}}</script>
                            <script type="application/json" class="label-print-sample-data">{{if empty($module_data['sample_data'])}}{}{{else /}}{{:json_encode($module_data.sample_data, JSON_UNESCAPED_UNICODE)}}{{/if}}</script>
                            {{:ModuleInclude('../../../module/view/label_print/form_label_print_designer', $module_data)}}
                        </div>
                        <div class="am-form-popup-submit am-text-left">
                            <button type="button" class="am-btn am-btn-warning am-radius am-btn-xs" data-am-modal-close>
                                <i class="am-icon-paint-brush"></i>
                                <span>{{:MyLang('cancel_title')}}</span>
                            </button>
                            <button type="button" class="am-btn am-btn-primary am-radius am-btn-xs label-print-popup-confirm">
                                <i class="am-icon-check"></i>
                                <span>{{:MyLang('confirm_title')}}</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{{/if}}
